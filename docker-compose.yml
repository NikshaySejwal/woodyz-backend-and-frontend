services:
  db:
    image: postgres:15-alpine
    container_name: woodyz-db
    environment:
      POSTGRES_DB: woodyz
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/postgres/init-create-app-role.sh:/docker-entrypoint-initdb.d/10-create-app-role.sh:ro
      - ./backend/db/postgres/create-app-role.sql:/docker-entrypoint-initdb.d/create-app-role.sql.in:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d woodyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: woodyz-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  backend:
    image: ${BACKEND_IMAGE:-woodyz-backend:local}
    build:
      context: ./backend
    container_name: woodyz-backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/woodyz
      SPRING_DATASOURCE_USERNAME: woodyz_app
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-false}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET must be set}
      SUPPORT_ENCRYPTION_KEY: ${SUPPORT_ENCRYPTION_KEY:?SUPPORT_ENCRYPTION_KEY must be set}
      APP_RLS_ENABLED: "true"
      APP_RATE_LIMIT_ENABLED: "true"
      APP_REQUIRE_HTTPS: ${APP_REQUIRE_HTTPS:-false}
      APP_CORS_ALLOW_HTTP_LOCALHOST: ${APP_CORS_ALLOW_HTTP_LOCALHOST:-true}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      APP_COMMERCE_ENABLED: ${APP_COMMERCE_ENABLED:-false}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:?SENDGRID_API_KEY must be set}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@woodyz.local}
      APP_SEED_DEMO_DATA: ${APP_SEED_DEMO_DATA:-false}
      APP_UPLOAD_DIR: /app/data/uploads
    volumes:
      - ./data/uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:-woodyz-frontend:local}
    build:
      context: ./woodyz-frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_COMMERCE_ENABLED: ${NEXT_PUBLIC_COMMERCE_ENABLED:-false}
        NEXT_PUBLIC_DEMO_PAYMENTS: ${NEXT_PUBLIC_DEMO_PAYMENTS:-false}
    container_name: woodyz-frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend

volumes:
  postgres_data:
