name: Verify and Publish Docker Images

on:
  push:
    branches:
      - master
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate production frontend settings
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_API_URL" ] || [ -z "$NEXT_PUBLIC_SITE_URL" ]; then
            echo "Set NEXT_PUBLIC_API_URL and NEXT_PUBLIC_SITE_URL as repository variables."
            exit 1
          fi
          node -e 'for (const name of ["NEXT_PUBLIC_API_URL", "NEXT_PUBLIC_SITE_URL"]) { const u = new URL(process.env[name]); if (u.protocol !== "https:") { console.error(`${name} must use HTTPS`); process.exit(1); } } const key = process.env.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY; if (key && !key.startsWith("pk_live_")) { console.error("NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY must be a live Stripe publishable key when configured"); process.exit(1); }'

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify backend
        run: mvn -B -f backend/pom.xml verify

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test manual QA runner safety
        run: python -m unittest test_suite_safety_test
        working-directory: backend

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: woodyz-frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: woodyz-frontend

      - name: Audit production frontend dependencies
        run: npm audit --omit=dev
        working-directory: woodyz-frontend

      - name: Test Manufacturing quote form validation
        run: npm run test:manufacturing-quote
        working-directory: woodyz-frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./woodyz-frontend
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_COMMERCE_ENABLED=${{ vars.NEXT_PUBLIC_COMMERCE_ENABLED }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/woodyz-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/woodyz-frontend:${{ github.sha }}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/woodyz-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/woodyz-backend:${{ github.sha }}
