name: Build and Deploy Docker Image

on:
  push:
    branches:
      - master
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify backend
        run: mvn -B -f backend/pom.xml verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./woodyz-frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/woodyz-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/woodyz-frontend:${{ github.sha }}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/woodyz-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/woodyz-backend:${{ github.sha }}
